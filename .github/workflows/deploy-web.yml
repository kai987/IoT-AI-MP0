name: Deploy Emotion Runner Web to GitHub Pages

on:
  push:
    branches: [codex/web-site-publish]
    paths:
      - "web/**"
      - "models/enet_b0_8_best_vgaf.onnx"
      - "models/face_landmarker.task"
      - "models/LICENSE-EMOTIEFFLIB.txt"
      - "models/LICENSE-MEDIAPIPE.txt"
      - "models/MODEL_SOURCES.md"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_BASE_PATH: /IoT-AI-MP0/

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify and build the site
        run: npm run check

      - name: Publish static site to gh-pages
        shell: bash
        working-directory: web/dist/client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy web site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
