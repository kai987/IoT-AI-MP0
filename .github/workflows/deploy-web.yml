name: Deploy Emotion Runner Web to GitHub Pages

on:
  push:
    branches: [codex/web-site-publish]
    paths:
      - "web/**"
      - "models/enet_b0_8_best_vgaf.onnx"
      - "models/face_landmarker.task"
      - "models/LICENSE-EMOTIEFFLIB.txt"
      - "models/LICENSE-MEDIAPIPE.txt"
      - "models/MODEL_SOURCES.md"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_BASE_PATH: /IoT-AI-MP0/

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install locked dependencies
        run: npm ci

      - name: Verify and build the site
        run: npm run check

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./web/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
